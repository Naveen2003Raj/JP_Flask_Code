    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const filterButtons =
                document.querySelectorAll(
                    "[data-work-filter]"
                );

            const getCards = () =>
    document.querySelectorAll("[data-work-category]");

            const additionalTabs =
                document.querySelectorAll(
                    ".additional-work-category"
                );

            const viewAllButton =
                document.querySelector(
                    "[data-w-view-toggle]"
                );

            const viewAllText =
                viewAllButton
                    ? viewAllButton.querySelector(
                        "[data-w-view-text]"
                    )
                    : null;


            const initialCategories = [
                "photography",
                "videography",
                "scriptwriter"
            ];


            let expanded = false;
            let activeCategory = "photography";


            /* =========================================================
               SHOW ONLY ONE CATEGORY
               ========================================================= */

            function showCategory(category) {

                activeCategory = category;


                getCards().forEach(card => {

                    const cardCategory =
                        card.dataset.workCategory;

                    if (cardCategory === category) {

                        card.classList.remove(
                            "wc-hidden"
                        );
                        card.classList.add("is-visible", "revealed");

                        card.style.opacity = "1";
                        card.style.transform =
                            "translateY(0)";
                        card.style.filter = "blur(0px)";

                    } else {

                        card.classList.add(
                            "wc-hidden"
                        );

                        card.style.opacity = "";
                        card.style.transform = "";

                    }

                });


                filterButtons.forEach(button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.workFilter === category
                    );

                });

            }


            /* =========================================================
               EXPAND TABS
               ========================================================= */

            function expandTabs() {

                expanded = true;

                if (viewAllButton) {
                    viewAllButton.classList.add(
                        "is-view-less"
                    );
                }

                additionalTabs.forEach(tab => {
                    tab.style.display = "inline-flex";
                });

                if (viewAllText) {
                    viewAllText.textContent =
                        getCurrentWorksTranslation(
                            "tabs.viewLess",
                            "View Less"
                        );
                }
            }
            /* =========================================================
               COLLAPSE TABS
               ========================================================= */

            function collapseTabs() {

                expanded = false;

                if (viewAllButton) {
                    viewAllButton.classList.remove(
                        "is-view-less"
                    );
                }

                additionalTabs.forEach(tab => {
                    tab.style.display = "none";
                });

                if (
                    !initialCategories.includes(
                        activeCategory
                    )
                ) {
                    showCategory("photography");
                }

                if (viewAllText) {
                    viewAllText.textContent =
                        getCurrentWorksTranslation(
                            "tabs.viewAll",
                            "View All"
                        );
                }
            }


            /* =========================================================
               VIEW ALL / VIEW LESS
               ========================================================= */

            if (viewAllButton) {

                viewAllButton.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();
                        event.stopPropagation();


                        if (expanded) {

                            collapseTabs();

                        } else {

                            expandTabs();

                        }

                    }
                );

            }


            /* =========================================================
               CATEGORY BUTTONS
               ========================================================= */

            filterButtons.forEach(button => {

                button.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();
                        event.stopPropagation();


                        const category =
                            this.dataset.workFilter;

                        if (!category) return;


                        showCategory(category);

                    }
                );

            });


            /* =========================================================
               INITIAL STATE
               ========================================================= */

            additionalTabs.forEach(tab => {

                tab.style.display =
                    "none";

            });


            showCategory(
                "photography"
            );
async function loadArticleCards(lang) {
    const anchor = document.querySelector('[data-work-card="press1"]');
    if (!anchor) return;

    try {
        const res = await fetch(`/api/contents?lang=${lang}`);
        if (!res.ok) return;
        const items = await res.json();

        const badge = lang === "ta" ? "சினிமா கட்டுரை" : "Cinema Essay";
        const action = lang === "ta" ? "கட்டுரையைக் காண →" : "View Article →";

        document.querySelectorAll("[data-api-article]")
            .forEach(el => el.remove());

        items.forEach((a, i) => {
            const card = document.createElement("article");
            card.className =
                `work-item-card ${i % 2 ? "reveal-right" : "reveal-left"}`;
            card.dataset.workCategory = "article";
            card.dataset.apiArticle = "";
            card.innerHTML = `
                <div class="work-media-preview">
                    <img src="https://images.unsplash.com/photo-1495020689067-958852a7765e?w=800&h=1000&q=80&auto=format&fit=crop"
                         alt="Cinema article" loading="lazy"
                         onerror="this.onerror=null;this.src='https://picsum.photos/seed/article/800/1000';">
                </div>
                <div class="work-item-body">
                    <div class="work-item-meta">
                        <span class="work-item-badge"></span>
                        <span class="work-item-year"></span>
                    </div>
                    <h3 class="work-item-title font-tamil"></h3>
                    <p class="work-item-desc font-tamil"></p>
                    <div class="work-item-footer">
                        <a class="work-action-btn"><span></span></a>
                    </div>
                </div>`;

            card.querySelector(".work-item-badge").textContent = badge;
            card.querySelector(".work-item-year").textContent = a.displayDate || "—";
            card.querySelector(".work-item-title").textContent = a.title;
            card.querySelector(".work-item-desc").textContent = a.excerpt || "";
            const link = card.querySelector(".work-action-btn");
            link.href = `/article?id=${encodeURIComponent(a.slug)}`;
            link.querySelector("span").textContent = action;

            anchor.before(card);
        });

        showCategory(activeCategory);
        if (typeof window.observeRevealElements === "function") {
            window.observeRevealElements();
        }
    } catch (err) {
        console.error(err);
    }
}

loadArticleCards(localStorage.getItem("site-lang") || "en");

document.addEventListener("languageChanged", e => {
    loadArticleCards(e.detail.language);
});

            /* =========================================================
               LANGUAGE HELPER
               ========================================================= */

            function getCurrentWorksTranslation(
                path,
                fallback
            ) {

                if (
                    typeof wTranslations ===
                    "undefined"
                ) {

                    return fallback;

                }


                const language =
                    localStorage.getItem(
                        "site-lang"
                    ) || "en";


                const value =
                    path
                        .split(".")
                        .reduce(
                            (obj, key) =>
                                obj &&
                                    obj[key] !== undefined
                                    ? obj[key]
                                    : undefined,
                            wTranslations[language]
                        );


                return value !== undefined
                    ? value
                    : fallback;

            }

        });
        const mobileToggle = document.querySelector('.mobile-toggle');
        const navLinksList = document.querySelector('.nav-links');

        if (mobileToggle && navLinksList) {
            mobileToggle.addEventListener('click', () => {
                const isOpen = navLinksList.classList.toggle('open');
                mobileToggle.setAttribute('aria-expanded', isOpen);
                mobileToggle.textContent = isOpen ? '✕' : '☰';
            });

            // Close the menu when a nav link is clicked (mobile only)
            navLinksList.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    navLinksList.classList.remove('open');
                    mobileToggle.textContent = '☰';
                });
            });
        }
    </script>
